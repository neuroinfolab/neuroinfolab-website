[[sections]]
title = "Course goal"
paragraphs = [ "We will introduce a number of advanced machine learning and computer vision tools relevant in neuroscience. Each technique will be illustrated via application to problems in neuroscience. We will cover topics including 1) computational models of the nervous system function and structure across several species, 2) development of computer vision and signal processing tools for analyzing neuroscience data and 3) tools and databases for management and sharing of large scale neural data." ]

[[sections]]
title = "Prerequisites"
paragraphs = [ "A good working knowledge of basic statistical concepts such as likelihood, Bayes' rule, Gaussian random vectors and linear-algebraic concepts such as regression and principal components analysis. Coding experience in Python, Matlab and/or R is necessary for course projects." ]

[[sections]]
title = "Evaluation"
paragraphs = [ "Final grades were based on class participation (20%), a midterm project (30%), and a final project (50%). Projects could involve either the implementation and justification of a novel analysis technique, or a standard analysis applied to a novel data set." ]

