name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://pxndey.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/neuroinfolab-demo' }}
          PUBLIC_SITE_LOCKED: 'false'
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      # Draft preview is taken offline until reviewed. Replace the built site
      # with a 404-only artifact so nothing from the draft is served.
      - name: Take draft offline
        run: |
          rm -rf dist
          mkdir -p dist
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>404 Not Found</title></head><body><h1>404</h1><p>There is no site here.</p></body></html>' > dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
